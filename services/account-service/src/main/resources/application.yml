server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexapay_account_db}
    username: ${DB_USER:nexapay}
    password: ${DB_PASS:nexapay_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:account-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nexapay}
    password: ${RABBITMQ_PASS:nexapay_secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

nexapay:
  kafka:
    topics:
      transfer-events: ${KAFKA_TOPIC_TRANSFER_EVENTS:nexapay.transfer.events}
      transfer-events-dlt: ${KAFKA_TOPIC_TRANSFER_EVENTS_DLT:nexapay.transfer.events.DLT}