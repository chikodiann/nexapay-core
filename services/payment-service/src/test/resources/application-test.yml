spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexapay_payment_db}
    username: ${DB_USER:nexapay}
    password: ${DB_PASS:nexapay_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  test:
    database:
      replace: NONE
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
  kafka:
    listener:
      auto-startup: false

services:
  account-service:
    base-url: http://localhost:8081

nexapay:
  outbox:
    publisher:
      enabled: false
      delay-ms: 60000