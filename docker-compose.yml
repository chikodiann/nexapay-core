services:
  # ---------------------------------------------------------------------------
  # Storage Layer: Account Database
  # ---------------------------------------------------------------------------
  postgres-account:
    image: postgres:16-alpine
    container_name: nexapay-postgres-account
    environment:
      POSTGRES_DB: nexapay_account_db
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_account_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexapay-network

  # ---------------------------------------------------------------------------
  # Storage Layer: Payment Database
  # ---------------------------------------------------------------------------
  postgres-payment:
    image: postgres:16-alpine
    container_name: nexapay-postgres-payment
    environment:
      POSTGRES_DB: nexapay_payment_db
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexapay-network

  # ---------------------------------------------------------------------------
  # Messaging Layer: Apache Kafka (KRaft Mode - No Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: nexapay-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexapay-network

  # ---------------------------------------------------------------------------
  # Messaging Layer: RabbitMQ with Management UI
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nexapay-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: nexapay
      RABBITMQ_DEFAULT_PASS: nexapay_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexapay-network

  # ---------------------------------------------------------------------------
  # Application Layer: Account Service
  # ---------------------------------------------------------------------------
  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    container_name: nexapay-account-service
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres-account
      DB_PORT: 5432
      DB_NAME: nexapay_account_db
      DB_USER: nexapay
      DB_PASS: nexapay_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: nexapay
      RABBITMQ_PASS: nexapay_secret
    depends_on:
      postgres-account:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nexapay-network

  # ---------------------------------------------------------------------------
  # Application Layer: Payment Service
  # ---------------------------------------------------------------------------
  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: nexapay-payment-service
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres-payment
      DB_PORT: 5432
      DB_NAME: nexapay_payment_db
      DB_USER: nexapay
      DB_PASS: nexapay_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8081
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_PUBLISHER_DELAY_MS: 3000
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
    networks:
      - nexapay-network

networks:
  nexapay-network:
    driver: bridge

volumes:
  postgres_account_data:
  postgres_payment_data:
  rabbitmq_data: