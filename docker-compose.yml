services:
  postgres:
    image: postgres:16-alpine
    container_name: nexapay-postgres
    environment:
      POSTGRES_USER: nexapay
      POSTGRES_PASSWORD: nexapay_secret
      POSTGRES_DB: nexapay_account_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexapay -d nexapay_account_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: